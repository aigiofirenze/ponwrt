name: Build Nokia XG-040G-MD

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xg040g-md-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Nokia XG-040G-MD
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev \
            libssl-dev libtool libyaml-dev lld llvm ninja-build p7zip-full \
            patch pkgconf python3 python3-docutils python3-pip python3-ply \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools \
            subversion swig texinfo uglifyjs unzip wget xmlto xxd \
            zlib1g-dev zstd

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-dl-xg040g-md-${{ hashFiles('feeds.conf.default', 'configs/*.config') }}
          restore-keys: |
            ponwrt-dl-xg040g-md-
            ponwrt-dl-

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure Nokia XG-040G-MD
        run: |
          ./scripts/kconfig.pl + \
            configs/an7581.config \
            configs/release.config > .config

          make defconfig

      - name: Show target configuration
        run: |
          echo "===== TARGET ====="
          grep -E \
            'CONFIG_TARGET_airoha_an7581|CONFIG_TARGET_DEVICE_airoha_an7581' \
            .config || true

          echo "===== U-BOOT ====="
          grep -E \
            'CONFIG_PACKAGE_u-boot-an7581_nokia_xg-040g-md' \
            .config || true

      - name: Download sources
        run: |
          make download -j"$(nproc)"

      - name: Build
        run: |
          make -j"$(nproc)"

      - name: List output
        run: |
          echo "===== OUTPUT ====="
          find bin/targets/airoha/an7581 -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-nokia-xg-040g-md
          path: |
            bin/targets/airoha/an7581/**
          if-no-files-found: error
          retention-days: 7
